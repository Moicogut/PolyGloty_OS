services:
  - type: web
    name: polyglot-voice
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /health
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: VOICE_PROVIDER
        value: gemini
      - key: VOICE_MODEL
        value: gemini-2.0-flash
      - key: VOICE_BACKUP_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
