services:
  - type: web
    name: polyglot-voice
    runtime: node
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: VOICE_PROVIDER
        value: gemini
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-exp
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
